/* ---------- helpers ---------- */

 q.dir=0;if(r()<.6){const n=q.p*(1+(r()-.5)*.0016);q.dir=Math.sign(n-q.p);q.p=n;q.h=Math.max(q.h,n);q.l=Math.min(q.l,n);q.v+=Math.round(r()*900)}})}

 demoTick()}
async function loadH(sym,force){const h=H[sym];if(h&&!force&&Date.now()-h.at<(sym==sel?15e3:9e4))return;let m5,d,demo=false;

  m5=bucket(ti.map(x=>[ms(x[0]),x[1],x[2]]),3e5);d=te.map(x=>{const c=x[1],o=x[3]==null?c:x[3];return{t:ms(x[0]),o,h:Math.max(o,c),l:Math.min(o,c),c,v:x[2]}}).sort((a,b)=>a.t-b.t)}catch(e){m5=null}}

function cand(s,t){const h=H[s],q=Q[s];if(!h)return[];let d=h.d.slice(-900),m=h.m5.slice(-600);const adj=x=>{x=({...x});x.c=q.p;x.h=Math.max(x.h,q.p);x.l=Math.min(x.l,q.p);return x};
 if(q&&q.p){if(!d.length||pk(d[d.length-1].t)<pk(Date.now()))d.push({t:Date.now(),o:q.o||q.p,h:q.h||q.p,l:q.l||q.p,c:q.p,v:0});else d[d.length-1]=adj(d[d.length-1]);if(m.length)m[m.length-1]=adj(m[m.length-1])}
 return t=='5m'?m:t=='1H'?agg(m,x=>Math.floor(x/36e5)):t=='D'?d:t=='W'?agg(d,x=>Math.floor((x/864e5+3)/7)):agg(d,x=>{const D=new Date(x);return D.getFullYear()*12+D.getMonth()})}
/* ---------- TECHNICAL AGENT ---------- */
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y)/n);

function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n&&i<c.length;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}g/=n;l/=n;for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100}
function adx(C,n=14){if(C.length<2*n+2)return{adx:0,pdi:0,mdi:0,atr:0};let tr=0,pd=0,md=0,A=null,dxs=[],PI=0,MI=0;
 for(let i=1;i<C.length;i++){const x=C[i],p=C[i-1],t=Math.max(x.h-x.l,Math.abs(x.h-p.c),Math.abs(x.l-p.c)),u=x.h-p.h,d=p.l-x.l,P=u>d&&u>0?u:0,M=d>u&&d>0?d:0;
